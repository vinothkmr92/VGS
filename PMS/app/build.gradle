apply plugin: 'com.android.application'

android {
    compileSdk 35
    defaultConfig {
        applicationId "com.example.vinoth.pms"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace ='com.example.vinoth.pms'
    buildFeatures {
        buildConfig =true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("PMS.apk")
            copy {
                from file("${project.buildDir}/app/release/${output.outputFileName}")
                // Change this to your desired destination path
                into "D:\\Dropbox\\Android_APK\\PMS.apk"
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.activity:activity:1.4.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation files('libs/ksoap2-android-assembly-2.4-jar-with-dependencies.jar')
    implementation 'com.squareup.retrofit2:retrofit:2.1.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.0.2'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation files('libs/poishadow-all.jar')
    implementation files('libs/tamilutillib.jar')
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.fintrace.core.drivers:tspl2-driver:0.0.12'
    implementation "androidx.biometric:biometric:1.1.0"
    implementation("com.github.PhilJay:MPAndroidChart:v3.1.0")
}
